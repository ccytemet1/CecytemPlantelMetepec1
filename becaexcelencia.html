<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Página en Mantenimiento</title>
<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', Arial, sans-serif;
}

/* Fondo difuminado */
.background {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: url('imagen1.jpg') no-repeat center center fixed;
    background-size: cover;
    filter: blur(6px);
    z-index: -1;
}

/* Tarjeta de mensaje */
.card {
    background: rgba(255,255,255,0.9);
    padding: 30px;
    border-radius: 12px;
    width: 500px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    text-align: center;
    position: relative;
    z-index: 1;
}

.card h1 {
    color: #166630;
    margin-bottom: 15px;
}

.card p {
    font-size: 18px;
    color: #333;
}

/* Botón verde */
button {
    margin-top: 20px;
    padding: 12px 25px;
    background: #008040; /* verde institucional */
    color: white;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.3s ease;
}
button:hover {
    background: #00cc66; /* verde más claro al pasar el mouse */
}
</style>
</head>
<body>
<div class="background"></div>
<div class="card">
    <h1>⚠️ Página en Mantenimiento</h1>
    <p>Estamos trabajando para mejorar tu experiencia. Espera la solicitud de tu beca muy pronto...<br>
    <strong>Vuelve proximo semestre</strong>.</p>
    <button onclick="window.location.href='index.html'">🏠 Regresar al Inicio</button>
</div>
</body>
</html>
